<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#1d2a3a">
  <title>石見銀山 世界遺産検定</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="app" class="app" aria-live="polite"></div>

  <!-- 確認ダイアログ（選択の確認・受付ボタンの確認で共用） -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div id="sheet-body"></div>
      <div class="sheet__actions">
        <button type="button" id="sheet-no" class="btn btn--ghost">えらびなおす</button>
        <button type="button" id="sheet-yes" class="btn btn--primary">はい</button>
      </div>
    </div>
  </div>

  <button type="button" id="sound-toggle" class="sound-toggle" aria-label="音のオン・オフ">🔊</button>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="quiz-data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
