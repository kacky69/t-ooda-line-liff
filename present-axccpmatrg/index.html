<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#1d2a3a">
  <title>世界遺産石見銀山 東京マルシェ 来場者プレゼント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&display=swap">
  <style>
    :root {
      --paper: #f5efe3; --card: #fffdf8; --ink: #1f1c18; --ink-2: #5d564b; --line: #d9cdb5;
      --ai: #1d2a3a; --shu: #c23b22; --ok: #2f7d4f; --ok-bg: #e6f2ea;
      --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      --gothic: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--paper); color: var(--ink); font-family: var(--gothic);
      font-size: 18px; line-height: 1.6; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    .app {
      max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .hd { text-align: center; padding: 8px 0 14px; border-bottom: 2px solid var(--line); margin-bottom: 18px; }
    .hd__sub { font-family: var(--mincho); font-weight: 700; font-size: 17px; color: var(--ink-2); letter-spacing: .06em; }
    .hd__title { font-family: var(--mincho); font-weight: 900; font-size: 26px; margin: 2px 0 0; letter-spacing: .08em; color: var(--ai); }
    .name { text-align: center; font-size: 24px; font-weight: 700; margin: 0 0 16px; word-break: break-all; }
    .notice {
      background: var(--shu); color: #fff; border-radius: 16px; padding: 18px 8px; margin: 0 0 22px;
      text-align: center; font-size: clamp(22px, 7.6vw, 32px); font-weight: 800; line-height: 1.4; letter-spacing: 0;
      box-shadow: 0 4px 0 #8c2614;
    }
    .items { display: grid; gap: 16px; }
    .item {
      width: 100%; min-height: 120px; border: 0; border-radius: 18px; padding: 16px 14px;
      background: var(--ai); color: #fff; box-shadow: 0 5px 0 #0e1620;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      transition: transform .08s ease, box-shadow .2s ease;
    }
    .item:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #0e1620; }
    .notice span, .msg__main span { display: inline-block; }
    .item__label { font-size: 24px; font-weight: 800; letter-spacing: .04em; }
    .item__act { font-size: 22px; font-weight: 700; background: #fff; color: var(--ai); border-radius: 999px; padding: 4px 22px; }
    .item.is-done { background: var(--ok-bg); color: var(--ok); box-shadow: none; border: 3px solid var(--ok); cursor: default; }
    .item.is-done .item__act { background: transparent; color: var(--ok); font-size: 24px; padding: 0; }
    .item.is-busy { opacity: .6; }
    .msg { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 24px 18px; text-align: center; margin-top: 8px; }
    .msg__main { font-size: 24px; font-weight: 800; line-height: 1.5; margin: 0; }
    .msg__sub { font-size: 17px; color: var(--ink-2); margin: 12px 0 0; }
    .msg .btn { margin-top: 18px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 10px 24px; border: 0; border-radius: 999px; font-weight: 700; font-size: 19px; }
    .btn--primary { background: var(--ai); color: #fff; box-shadow: 0 4px 0 #0e1620; }
    .btn--ghost { background: transparent; color: var(--ink-2); border: 2px solid var(--line); }
    .loading { text-align: center; color: var(--ink-2); padding: 40px 0; font-size: 18px; }
    .spin { width: 36px; height: 36px; border: 4px solid var(--line); border-top-color: var(--ai); border-radius: 50%; margin: 0 auto 14px; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    .toast { margin: 16px 0 0; text-align: center; color: var(--shu); font-weight: 700; font-size: 17px; min-height: 1em; }
    /* 確認 */
    .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
    .sheet[hidden] { display: none; }
    .sheet__bg { position: absolute; inset: 0; background: rgba(20, 16, 10, .55); }
    .sheet__panel {
      position: relative; width: 100%; max-width: 480px; background: var(--card); border-radius: 22px 22px 0 0;
      padding: 26px 18px calc(22px + env(safe-area-inset-bottom)); text-align: center; animation: up .2s ease both;
    }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet__item { font-size: 20px; font-weight: 700; color: var(--ink-2); margin: 0; }
    .sheet__q { font-size: 26px; font-weight: 800; line-height: 1.45; margin: 6px 0 8px; }
    .sheet__warn { font-size: 18px; font-weight: 700; color: var(--shu); margin: 0 0 20px; }
    .sheet__actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
    .sheet__actions .btn { width: 100%; }
    .thanks { text-align: center; font-size: 18px; font-weight: 700; color: var(--ink-2); margin: 0 0 14px; }
    .item__time { font-size: 34px; font-weight: 800; line-height: 1.2; }
    .test { background: #fff2cc; border: 2px dashed #c9a227; border-radius: 14px; padding: 12px; margin: 22px 0 0; text-align: center; font-size: 16px; color: #6b5310; }
    .test .btn { margin-top: 10px; min-height: 46px; font-size: 16px; }
    .foot { text-align: center; font-size: 14px; color: var(--ink-2); margin-top: 26px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="hd">
      <div class="hd__sub">世界遺産石見銀山 東京マルシェ</div>
      <h1 class="hd__title">来場者プレゼント</h1>
    </header>
    <div id="view"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
    <p class="foot">東京大田市人会</p>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet__bg" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <p class="sheet__item" id="sheet-item"></p>
      <p class="sheet__q">スタッフの前で<br>押していますか？</p>
      <p class="sheet__warn">押すと元に戻せません</p>
      <div class="sheet__actions">
        <button type="button" class="btn btn--ghost" data-close>もどる</button>
        <button type="button" class="btn btn--primary" id="sheet-yes">受け取った</button>
      </div>
    </div>
  </div>

  <script>
    // 東京大田市人会 公式LINE：世界遺産石見銀山 東京マルシェ（2026-11-28）の来場者プレゼント。
    // 2026-11-26 クッキー方式：メニュー「来場者プレゼント」から直接このページが開く。
    // 受け取り済みかどうかはこのスマホの中（localStorage＋クッキー）だけに保存する。名前は出さない。
    // 押されたら GAS（doGet ?action=count）に知らせて、何人に渡したかだけを数える（名簿「来場者プレゼント記録」タブ）。
    // LINE アプリの中で開いたときだけボタンを出す（Safari などで開き直して、もう一度押せないように）。
    // 本番は 11/28（日本時間）だけ。それより前は「テスト中」で、テストの記録を消すボタンが付く。11/29 以降は終了と出す。
    var API = 'https://script.google.com/macros/s/AKfycbzXdRRBMFe4aW-FXYUZnYX3LI_z0UfZW44QfIQ8_dWuRdRwRF2m-CBqPIa3cFEEqKCl/exec';
    var EVENT_DAY = '2026-11-28';
    var ITEMS = [{ key: 'furikake', label: 'ふりかけ' }, { key: 'rice', label: 'お米すくい取り' }];
    var view = document.getElementById('view');
    var sheet = document.getElementById('sheet');
    var pending = null;

    function jstDay() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
    function jstTime() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(11, 16); }
    var day = jstDay();
    var MODE = day === EVENT_DAY ? 'real' : (day < EVENT_DAY ? 'test' : 'over');
    var KEY = MODE === 'real' ? 'ooda_present_20261128' : 'ooda_present_test';

    // 保存：localStorage とクッキーの両方に書き、読むときはどちらかに残っていればよい
    function cookieGet(k) {
      var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function cookieSet(k, v, days) {
      document.cookie = k + '=' + encodeURIComponent(v) + '; max-age=' + (days * 86400) + '; path=/; SameSite=Lax; Secure';
    }
    function load(k) {
      var v = null;
      try { v = localStorage.getItem(k); } catch (e) {}
      if (!v) v = cookieGet(k);
      return v;
    }
    function save(k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
      cookieSet(k, v, 60);
    }
    function wipe(k) {
      try { localStorage.removeItem(k); } catch (e) {}
      document.cookie = k + '=; max-age=0; path=/; SameSite=Lax; Secure';
    }
    function readState() { try { return JSON.parse(load(KEY) || '{}') || {}; } catch (e) { return {}; } }
    function device() {
      var d = load('ooda_present_dev');
      if (!d) { d = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); save('ooda_present_dev', d); }
      return d;
    }

    function isLineApp() { return /\bLine\//i.test(navigator.userAgent || ''); }

    function showMessage(main, sub) {
      view.innerHTML = '<div class="msg"><p class="msg__main">' + main + '</p>' + (sub ? '<p class="msg__sub">' + sub + '</p>' : '') + '</div>';
    }

    function render() {
      var st = readState();
      var html = '<p class="thanks">LINE友だち登録ありがとうございます</p>' +
        '<div class="notice"><span>受付のスタッフの前で</span><span>ボタンを押してください</span></div><div class="items">';
      ITEMS.forEach(function (it) {
        if (st[it.key]) {
          html += '<button type="button" class="item is-done" disabled><span class="item__label">' + it.label + '</span>' +
            '<span class="item__act">✅ 受け取り済み</span><span class="item__time">' + st[it.key] + '</span></button>';
        } else {
          html += '<button type="button" class="item" data-item="' + it.key + '"><span class="item__label">' + it.label + '</span>' +
            '<span class="item__act">受け取った</span></button>';
        }
      });
      html += '</div>';
      if (MODE === 'test') {
        html += '<div class="test">テスト中です（本番は 11/28 当日）<br>テストで押した記録は、当日の本番には残りません' +
          '<br><button type="button" class="btn btn--ghost" id="reset">テストの記録を消す</button></div>';
      }
      view.innerHTML = html;
      var r = document.getElementById('reset');
      if (r) r.addEventListener('click', function () { wipe(KEY); render(); });
    }

    function count(key) {
      var q = 'action=count&item=' + key + '&mode=' + MODE + '&dev=' + encodeURIComponent(device());
      try { fetch(API + '?' + q, { method: 'GET', mode: 'no-cors', cache: 'no-store', keepalive: true }); } catch (e) {}
    }

    view.addEventListener('click', function (e) {
      var b = e.target.closest('[data-item]');
      if (!b || b.disabled) return;
      pending = b.getAttribute('data-item');
      ITEMS.forEach(function (it) { if (it.key === pending) document.getElementById('sheet-item').textContent = it.label; });
      sheet.hidden = false;
    });
    sheet.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { sheet.hidden = true; pending = null; }
    });
    document.getElementById('sheet-yes').addEventListener('click', function () {
      var key = pending;
      sheet.hidden = true; pending = null;
      if (!key) return;
      var st = readState();
      if (st[key]) { render(); return; }
      st[key] = jstTime();
      save(KEY, JSON.stringify(st));
      render();
      count(key);
    });

    if (!isLineApp()) {
      showMessage('<span>LINEアプリの中で</span><span>開いてください</span>', '東京大田市人会の公式LINEで、メニューの「来場者プレゼント」を押すと開きます');
    } else if (MODE === 'over') {
      showMessage('<span>来場者プレゼントは</span><span>終了しました</span>', 'ご来場ありがとうございました');
    } else {
      render();
    }
  </script>
</body>
</html>
